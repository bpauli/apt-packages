name: Update APT Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Debian package name (e.g., gccli)"
        required: true
        type: string
      tag:
        description: "Release tag (e.g., v0.1.1)"
        required: true
        type: string
      repository:
        description: "Source repository (e.g., bpauli/zwift-bootstrap)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  update-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apt-packages
        uses: actions/checkout@v4
        with:
          # The branch tip at run time, not the commit of the dispatch, so that a
          # queued run builds on the push of the run before it.
          ref: main

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Install nfpm
        run: |
          curl -fsSLO https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/checksums.txt \
            | grep ' nfpm_2.47.0_amd64.deb$' | sha256sum --check
          sudo dpkg -i nfpm_2.47.0_amd64.deb
          rm nfpm_2.47.0_amd64.deb

      - name: Download, verify and package the release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ inputs.repository }}
        run: scripts/fetch-package.sh "${PACKAGE}" "${TAG}" "${REPO}"

      - name: Rebuild and sign the indexes
        run: scripts/update-repo.sh

      - name: Commit and push
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
        run: |
          git add pool dists
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update ${PACKAGE} to ${TAG}"
          git push
