name: gccli
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Burkhard Pauli <burkhard@pauli.tech>
description: Command-line interface for Garmin Connect
homepage: https://github.com/bpauli/gccli
license: MIT
contents:
  - src: ./gccli
    dst: /usr/bin/gccli
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/gccli/copyright
    file_info:
      mode: 0644
  - src: ./README.md
    dst: /usr/share/doc/gccli/README.md
    file_info:
      mode: 0644
